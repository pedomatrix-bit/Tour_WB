<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#F5EFE6" stroke="#0F1A2F" stroke-width="4" />
  
  <g clip-path="url(#circleClip)">
    <!-- Sky background -->
    <rect x="0" y="0" width="100" height="100" fill="#F5EFE6" />
    
    <!-- Warm Sun -->
    <circle cx="68" cy="32" r="14" fill="#E5A647" />
    
    <!-- Terracotta Back Hills -->
    <path d="M48 40 Q65 30 96 55 L96 85 L45 85 Z" fill="#C45C4A" stroke="#0F1A2F" stroke-width="2.5" stroke-linejoin="round" />
    
